<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSL v0.5.0 | Temporal Displacement</title>
    
    <!-- IMPORT THE v0.5.0 ENGINE -->
    <link rel="stylesheet" href="../houdini.css">

    <!-- FONT: Tech/Industrial feel -->
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* 1. SCENE LOGIC (Local calculations) */
            /* We map the engine's --progress (0 to 1) to local color vars */
            --bg-hue: calc(260 - (var(--progress) * 240)); /* Purple -> Gold */
            --bg-lit: calc(5% + (var(--progress) * 15%));  /* Dark -> Dim */
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            
            /* Apply the calculated background */
            background: hsl(var(--bg-hue) 30% var(--bg-lit));
            color: white;
            font-family: "Syncopate", sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            
            /* Smooth background transitions */
            transition: background 0.1s linear;
        }

        .viewport {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            
            /* LAYER 6: PERPSECTIVE */
            /* We set the stage depth */
            --perspective: 1200px;
            perspective: var(--perspective);
        }

        /* 
           THE ARTIFACT 
           Demonstrates:
           1. --radius (v0.5.0 Percentage Support)
           2. --rotate-z (Physics Layer)
           3. --hue (Color Layer)
        */
        .chronos-core {
            position: relative;
            
            /* GEOMETRY: 40% of the viewport min-dimension */
            --width: 40vmin;
            --height: 40vmin;
            
            /* v0.5.0 PROOF: 
               Animating radius from 0px (Square) to 50% (Circle).
               This would fail in v0.4.0. 
            */
            --radius: calc(var(--progress) * 50%);
            
            /* COLOR LOGIC */
            --hue: calc(280 - (var(--progress) * 240));
            --glow: calc(var(--progress) * 80px);
            
            /* PHYSICS LOGIC */
            --rotate-z: calc(var(--progress) * 180deg);
            --z: calc(var(--progress) * 200px); /* Moves closer to camera */

            /* APPLY THE ENGINE VARS */
            width: var(--width);
            height: var(--height);
            border-radius: var(--radius);
            background: white;
            
            /* HSL Engine allows complex composed shadows */
            box-shadow: 
                0 0 var(--glow) white,
                0 0 calc(var(--glow) * 2) hsl(var(--hue) 100% 50% / 0.5);
            
            /* HSL Engine allows strict 3D transforms */
            transform: 
                translateZ(var(--z)) 
                rotateZ(var(--rotate-z));
            
            /* INTERPOLATION SETTINGS */
            /* We tell the browser strictly how to handle these types */
            transition: 
                --radius 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                --hue 0.4s ease,
                --z 0.8s ease,
                --rotate-z 1s ease;
        }

        /* TEXTURE OVERLAY (Standard CSS, non-Houdini) */
        .chronos-core::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit; /* Inherits the morphing radius */
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.2;
            mix-blend-mode: overlay;
        }

        /* 
           TYPOGRAPHY LAYER 
           Demonstrates variable fonts driven by Houdini
        */
        .temporal-label {
            position: absolute;
            bottom: 15%;
            left: 10%;
            
            /* LAYER 5: VOICE */
            /* Weight goes from 100 (Thin) to 900 (Black) */
            --font-weight: calc(100 + (var(--progress) * 800));
            
            /* Spacing tightens as it gets heavier */
            --letter-space: calc(20px - (var(--progress) * 15px));
            
            font-size: 8vw;
            font-weight: var(--font-weight);
            letter-spacing: var(--letter-space);
            text-transform: uppercase;
            pointer-events: none;
            mix-blend-mode: difference;
            
            transition: --font-weight 0.4s ease, --letter-space 0.6s ease;
        }

        .data-stream {
            position: absolute;
            top: 10%;
            right: 10%;
            font-family: monospace;
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            text-align: right;
            line-height: 2;
        }

        /* UI CONTROLS */
        .controls {
            height: 120px;
            background: rgba(255, 255, 255, 0.03);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 40px;
            gap: 20px;
            z-index: 10;
        }

        input[type="range"] {
            width: 100%;
            max-width: 600px;
            cursor: pointer;
        }

        .tick {
            font-size: 10px;
            letter-spacing: 2px;
            opacity: 0.5;
        }

    </style>
</head>
<body>

    <div class="viewport">
        <div class="data-stream">
            PHASE: <span id="phase-label">STASIS</span><br>
            INPUT_VAR: --progress<br>
            GEO_TYPE: <span id="geo-label">RECT</span>
        </div>
        
        <div class="chronos-core"></div>
        
        <div class="temporal-label">
            Shift
        </div>
    </div>

    <div class="controls">
        <span class="tick">0.0</span>
        <!-- 
            INPUT LAYER:
            We map the slider directly to the Global --progress variable.
            The HSL Engine handles the distribution to all other layers.
        -->
        <input type="range" min="0" max="1" step="0.001" value="0" id="driver">
        <span class="tick">1.0</span>
    </div>

    <script>
        const driver = document.getElementById('driver');
        const root = document.documentElement;
        const phaseLabel = document.getElementById('phase-label');
        const geoLabel = document.getElementById('geo-label');
        const labelText = document.querySelector('.temporal-label');

        driver.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            
            // 1. Update the Engine
            root.style.setProperty('--progress', val);

            // 2. Update the Meta-Data (UI Text)
            if (val < 0.3) {
                phaseLabel.textContent = "STASIS";
                geoLabel.textContent = "POLY_SQR";
                labelText.textContent = "DUSK";
            } else if (val < 0.7) {
                phaseLabel.textContent = "TRANSITION";
                geoLabel.textContent = "MORPH_SUBD";
                labelText.textContent = "SHIFT";
            } else {
                phaseLabel.textContent = "PEAK_FLUX";
                geoLabel.textContent = "PRIM_CIRC";
                labelText.textContent = "DAWN";
            }
        });
    </script>
</body>
</html>
