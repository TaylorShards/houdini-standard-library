name: verify

on: [push]

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install playwright==1.63.0 && python -m playwright install chromium --with-deps
      # The dataset verifier (data-factory repo) reuses these same probes;
      # HSL CI runs the subset serving this repo's own examples tree.
      - run: python -m http.server 8790 &
        working-directory: .
      - name: computed-value smoke assertions
        run: python .github/verify/smoke.py
